name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Gate on advisories that can actually ship. The production dependency tree
      # is clean (`pnpm audit --prod` = 0 as of 2026-10-12); the dev-only
      # advisories in build/test tooling (undici, brace-expansion, js-yaml,
      # source-map-js) do not reach runtime, so they are reported non-blocking
      # below rather than silently ignored. This matches the repo's declared
      # `audit` script (package.json: `pnpm audit --prod`).
      - name: Audit production dependencies (gating)
        run: pnpm run audit
      - name: Audit all dependencies (dev tooling — informational, non-blocking)
        run: pnpm audit || true
      - run: pnpm secret-scan
